model:
  arch: video_llama
  model_type: pretrain_vicuna
  freeze_vit: True
  freeze_qformer: True
  

  # Q-Former
  num_frames: 8
  num_query_token: 32

  # If you want train models based on LLaMA-2-chat,
  # some ckpts could be download from our provided huggingface repo
  # i.e.  https://huggingface.co/DAMO-NLP-SG/Video-LLaMA-2-13B-Pretrained
  llama_model: "/mnt/disks/chfuab/Llama-2-7b-chat-hf"
  # imagebind_ckpt_path: "ckpt/imagebind_path/"
  llama_proj_model: "/mnt/disks/chfuab/pretrained_minigpt4_7b.pth"
  
  # only train vision branch
  equip_audio_branch: False  # whether equips the audio branch
  frozen_llama_proj: False
  frozen_video_Qformer: True
  frozen_audio_Qformer: True
  use_lora_in_Qformer: False
  use_lora_in_video_Qformer: True
  
  fusion_head_layers: 2
  max_frame_pos: 32
  fusion_header_type: "seqTransf"
  num_video_query_token: 32

datasets:
  nextQA:
    data_type: video
    build_info:
      anno_dir: /mnt/disks/chfuab/nextqa/anno_dir_train/
      videos_dir: /mnt/disks/chfuab/nextqa/videos_dir_train/
      anno_dir_val: /mnt/disks/chfuab/nextqa/anno_dir_val/
      videos_dir_val: /mnt/disks/chfuab/nextqa/videos_dir_val/

    vis_processor:
      train:
        name: "nextQA_video_train"
        n_frms: 8
        image_size: 224
      eval:
        name: "nextQA_video_train"
        n_frms: 8
        image_size: 224      
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
    sample_ratio: 100

run:
  task: video_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 8e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 25
  batch_size_train: 16 #32
  batch_size_eval: 16 #32
  num_workers: 1 #8
  warmup_steps: 2500
  iters_per_epoch: 2000 #2500

  seed: 42
  output_dir: "output/videollama_interaction"

  amp: True
  # resume_ckpt_path: True
  ckpt_path: "output/videollama_interaction/VL_LLaMA_2_7B_Finetuned.pth"
  # ckpt_path: "output/videollama_interaction/checkpoint_best.pth"

  evaluate: False 
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False # True

  # newly added items:
  allowed_metrics_delta: 0.05
  agg_metrics: "loss"
  agg_mode: "min"
  valid_splits: ["eval"]
  test_splits: ["eval"]
  evaluate_metrics: ["loss", "accuracy"]
  iters_per_epoch_eval: 300